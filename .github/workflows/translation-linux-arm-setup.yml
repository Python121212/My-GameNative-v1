name: ARM Linux 変換器の予備構築
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/translation-benchmark/hello-x86_64.s'
      - '.github/workflows/translation-linux-arm-setup.yml'
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: ARM64 と基礎ツールを確認
        run: |
          test "$(uname -m)" = aarch64
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y software-properties-common cmake ninja-build binutils-x86-64-linux-gnu proot p7zip-full xvfb
      - name: FEX Linux 版を用意
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          set +e
          bash -ec '
            sudo add-apt-repository -y ppa:fex-emu/fex
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fex-emu-armv8.0
            command -v FEX
          ' 2>&1 | tee "$RUNNER_TEMP/results/fex-install.txt"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$(tail -n 35 "$RUNNER_TEMP/results/fex-install.txt" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::FEX の導入に失敗%0A$details"
            exit "$status"
          fi
      - uses: actions/cache/restore@v4
        id: box64_cache
        with:
          path: ${{ runner.temp }}/box64-cache
          key: box64-v0.4.4-2f130fab1d6e1a4ee8a71dc60cfdfcc839ad192a-linux-arm64
      - name: Box64 Linux 版をビルド
        if: steps.box64_cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.4.4 https://github.com/ptitSeb/box64.git "$RUNNER_TEMP/box64"
          git -C "$RUNNER_TEMP/box64" rev-parse HEAD
          cmake -S "$RUNNER_TEMP/box64" -B "$RUNNER_TEMP/box64-build" -G Ninja -DARM_DYNAREC=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/box64-build" -j 2
          mkdir -p "$RUNNER_TEMP/box64-cache"
          cp "$RUNNER_TEMP/box64-build/box64" "$RUNNER_TEMP/box64-cache/box64"
      - uses: actions/cache/save@v4
        if: steps.box64_cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/box64-cache
          key: box64-v0.4.4-2f130fab1d6e1a4ee8a71dc60cfdfcc839ad192a-linux-arm64
      - name: 両変換器で x86-64 Linux 実行ファイルを起動
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          x86_64-linux-gnu-as tools/translation-benchmark/hello-x86_64.s -o "$RUNNER_TEMP/hello.o"
          x86_64-linux-gnu-ld -o "$RUNNER_TEMP/hello-x86_64" "$RUNNER_TEMP/hello.o"
          file "$RUNNER_TEMP/hello-x86_64" | tee "$RUNNER_TEMP/results/type.txt"
          timeout 60 FEX "$RUNNER_TEMP/hello-x86_64" | tee "$RUNNER_TEMP/results/fex.txt"
          grep -Fx 'translation-smoke-ok' "$RUNNER_TEMP/results/fex.txt"
          timeout 60 "$RUNNER_TEMP/box64-cache/box64" "$RUNNER_TEMP/hello-x86_64" | tee "$RUNNER_TEMP/results/box64.txt"
          grep -Fx 'translation-smoke-ok' "$RUNNER_TEMP/results/box64.txt"
      - name: Windows ベンチマーク用の Wine 環境を試験構築
        run: |
          set +e
          bash -e -o pipefail -c '
            image=scottyhardy/docker-wine@sha256:c61cfc490aaee10b96782b88733a0f3d0e7b425d93b4e96617d9ab9a2b6bcfd2
            docker pull --platform linux/amd64 "$image"
            docker image inspect "$image" --format "{{json .RepoDigests}}" > "$RUNNER_TEMP/results/wine-image.txt"
            container=$(docker create --platform linux/amd64 "$image")
            mkdir -p "$RUNNER_TEMP/wine-rootfs"
            docker export "$container" | tar -x -C "$RUNNER_TEMP/wine-rootfs" --no-same-owner --no-same-permissions --exclude="dev/*"
            docker rm "$container"
            bash tools/translation-benchmark/prepare-windows-benchmark.sh "$RUNNER_TEMP/benchmark"
            echo "FEX で Wine のバージョンを取得します"
            wine_bin=$(find "$RUNNER_TEMP/wine-rootfs/opt" -type f \( -name wine64 -o -name wine \) -print -quit)
            test -n "$wine_bin"
            file "$wine_bin"
            FEX_ROOTFS="$RUNNER_TEMP/wine-rootfs" timeout 120 FEX "$wine_bin" --version
            echo "Box64 で Wine のバージョンを取得します"
            export BOX64_LD_LIBRARY_PATH="$RUNNER_TEMP/wine-rootfs/lib/x86_64-linux-gnu:$RUNNER_TEMP/wine-rootfs/usr/lib/x86_64-linux-gnu:$RUNNER_TEMP/wine-rootfs/opt/wine-stable/lib/wine/x86_64-unix"
            export BOX64_PATH="$RUNNER_TEMP/wine-rootfs/opt/wine-stable/bin"
            timeout 120 "$RUNNER_TEMP/box64-cache/box64" "$wine_bin" --version
            find "$RUNNER_TEMP/wine-rootfs/opt/wine-stable" -iname kernel32.dll -print
            test ! -e /opt/wine-stable
            sudo ln -s "$RUNNER_TEMP/wine-rootfs/opt/wine-stable" /opt/wine-stable
            export WINEARCH=win64
            export WINEDLLPATH="$RUNNER_TEMP/wine-rootfs/opt/wine-stable/lib/wine"
            export PATH="$RUNNER_TEMP/wine-rootfs/opt/wine-stable/bin:$PATH"
            echo "FEX で Windows 版ベンチマークを動作確認します"
            timeout 300 xvfb-run -a env WINEDEBUG=-all WINEPREFIX="$RUNNER_TEMP/wine-fex" FEX_ROOTFS="$RUNNER_TEMP/wine-rootfs" FEX "$wine_bin" "$RUNNER_TEMP/benchmark/7za.exe" b -mmt1 -md20 2>&1 | tee "$RUNNER_TEMP/results/windows-fex.txt"
            grep -E "^Tot:" "$RUNNER_TEMP/results/windows-fex.txt"
            echo "Box64 で空の Wine 設定を独立して初期化し、Windows 版ベンチマークを実行します"
            test ! -e "$RUNNER_TEMP/wine-box64"
            timeout 420 xvfb-run -a env BOX64_LOG=1 WINEDEBUG=-all WINEDLLOVERRIDES="winemenubuilder.exe=d;mscoree,mshtml=" WINEPREFIX="$RUNNER_TEMP/wine-box64" "$RUNNER_TEMP/box64-cache/box64" "$wine_bin" "$RUNNER_TEMP/benchmark/7za.exe" b -mmt1 -md20 2>&1 | tee "$RUNNER_TEMP/results/windows-box64.txt"
            grep -E "^Tot:" "$RUNNER_TEMP/results/windows-box64.txt"
          ' 2>&1 | tee "$RUNNER_TEMP/results/wine-setup.txt"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$(tail -n 30 "$RUNNER_TEMP/results/wine-setup.txt" | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::Wine 環境構築に失敗%0A$details"
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: linux-arm-translator-smoke
          path: ${{ runner.temp }}/results/*.txt
          if-no-files-found: ignore
