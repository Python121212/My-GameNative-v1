name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Android variant
        type: choice
        options:
          - modern
          - legacy
        default: modern
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.3.13750724'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          if [ "$VARIANT" = modern ]; then
            ./gradlew :app:assembleModernDebug --no-daemon
          else
            ./gradlew :app:assembleLegacyDebug --no-daemon
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamenative-${{ inputs.variant }}-debug-apk
          path: app/build/outputs/apk/${{ inputs.variant }}/debug/*.apk
          if-no-files-found: error
          retention-days: 14
