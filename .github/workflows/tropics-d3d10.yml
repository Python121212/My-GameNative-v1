name: Tropics Direct3D 10 の動作と FPS
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tropics-d3d10.yml'
      - 'tools/tropics-benchmark/**'
permissions:
  contents: read
jobs:
  tropics:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
      - name: 32-bit Wine とソフトウェア描画を準備
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y wine wine32:i386 wine64 msitools xserver-xorg-core xserver-xorg-video-dummy x11-utils x11-apps mesa-utils mesa-vulkan-drivers mesa-vulkan-drivers:i386 vulkan-tools python3-pil imagemagick
      - name: Tropics と DXVK の取得
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tropics"
          curl -fL --retry 3 https://www.phoronix-test-suite.com/benchmark-files/Unigine_Tropics-1.3.msi -o "$RUNNER_TEMP/tropics/tropics.msi"
          echo '844e70714274105172086c21910a930ba56d50c167f85e9f4888279f89535116  '"$RUNNER_TEMP/tropics/tropics.msi" | sha256sum -c -
          curl -fL --retry 3 https://github.com/doitsujin/dxvk/releases/download/v2.6.1/dxvk-2.6.1.tar.gz -o "$RUNNER_TEMP/tropics/dxvk.tar.gz"
          msiextract -C "$RUNNER_TEMP/tropics/files" "$RUNNER_TEMP/tropics/tropics.msi" > "$RUNNER_TEMP/tropics/extract.log"
          find "$RUNNER_TEMP/tropics/files" -iname 'Tropics.exe' -print | tee "$RUNNER_TEMP/tropics/exe.txt"
          test "$(wc -l < "$RUNNER_TEMP/tropics/exe.txt")" -eq 1
      - name: Tropics を DX10 で起動して検査
        run: bash tools/tropics-benchmark/probe.sh "$RUNNER_TEMP/tropics"
      - name: 診断結果の要約
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'tropics' / 'summary.txt'
          text = p.read_text(errors='replace')[-8000:] if p.exists() else '要約なし。前段階の取得・準備失敗を確認してください。'
          print('::notice::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tropics-d3d10-diagnostics
          path: |
            ${{ runner.temp }}/tropics/*.txt
            ${{ runner.temp }}/tropics/*.log
            ${{ runner.temp }}/tropics/*.png
          if-no-files-found: ignore
          retention-days: 14
