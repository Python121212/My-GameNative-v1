name: 命令変換の ARM 環境確認
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/translation-benchmark/probe-arm-runner.sh'
      - '.github/workflows/translation-arm-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: ARM ホストと FEX パックを確認
        run: bash tools/translation-benchmark/probe-arm-runner.sh
      - name: 確認結果を保存
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: translation-arm-probe
          path: |
            translation-probe-results/*.txt
          if-no-files-found: warn
          retention-days: 14
