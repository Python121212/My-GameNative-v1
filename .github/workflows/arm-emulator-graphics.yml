name: ARM 変換エミュレーター描画確認

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/arm-emulator-graphics.yml'
      - 'app/src/androidTest/java/app/gamenative/ArmNativeBridgeSmokeTest.kt'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK の準備
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.3.13750724'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: アプリとテスト APK のビルド
        run: |
          touch local.properties
          ./gradlew :app:assembleModernDebug :app:assembleModernDebugAndroidTest \
            --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' \
            -Pkotlin.daemon.jvmargs=-Xmx5g
      - name: KVM の有効化
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: エミュレーターで ARM64 と描画を確認
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test-arm-emulator.sh
      - name: テスト結果の保存
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arm-emulator-graphics-result
          path: |
            emulator-results/*.txt
          if-no-files-found: ignore
          retention-days: 14
