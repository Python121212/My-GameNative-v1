name: ARM 変換エミュレーター描画確認

on:
  workflow_call:
  workflow_dispatch:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK の準備
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.3.13750724'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: アプリとテスト APK のビルド
        run: |
          touch local.properties
          set +e
          ./gradlew :app:assembleModernDebug :app:assembleModernDebugAndroidTest \
            --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' \
            -Pkotlin.daemon.jvmargs=-Xmx5g 2>&1 | tee gradle-emulator.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$(tail -n 60 gradle-emulator.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::$details"
          fi
          exit "$status"
      - name: KVM の確認
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'disable=false' >> "$GITHUB_OUTPUT"
            echo 'KVM を使用します。'
          else
            echo 'disable=true' >> "$GITHUB_OUTPUT"
            echo '::warning::KVM が利用できないため、低速なソフトウェア CPU エミュレーションを使用します。'
          fi
      - name: エミュレーターで ARM64 と描画を確認
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 1800
          disable-linux-hw-accel: ${{ steps.kvm.outputs.disable }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test-arm-emulator.sh
      - name: テスト結果の保存
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arm-emulator-graphics-result
          path: |
            emulator-results/*.txt
            emulator-results/*.png
          if-no-files-found: ignore
          retention-days: 14
