name: ARM 変換エミュレーター描画確認

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '試験をすべて通過した同一 APK を debug プレリリースとして公開'
        type: boolean
        default: false
  push:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK の準備
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.3.13750724'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: アプリとテスト APK のビルド
        run: |
          touch local.properties
          set +e
          ./gradlew :app:assembleModernDebug :app:assembleModernDebugAndroidTest \
            --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' \
            -Pkotlin.daemon.jvmargs=-Xmx5g 2>&1 | tee gradle-emulator.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$(tail -n 60 gradle-emulator.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::$details"
          fi
          exit "$status"
      - name: KVM の確認
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'disable=false' >> "$GITHUB_OUTPUT"
            echo 'KVM を使用します。'
          else
            echo 'disable=true' >> "$GITHUB_OUTPUT"
            echo '::warning::KVM が利用できないため、低速なソフトウェア CPU エミュレーションを使用します。'
          fi
      - name: エミュレーターで ARM64 と描画を確認
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 1800
          disable-linux-hw-accel: ${{ steps.kvm.outputs.disable }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test-arm-emulator.sh
      - name: 失敗時の診断情報
        if: ${{ failure() }}
        run: |
          for file in emulator-results/device.txt emulator-results/instrumentation.txt emulator-results/launch.txt; do
            if [ -f "$file" ]; then
              details=$(tail -n 80 "$file" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error::$file%0A$details"
            else
              echo "::warning::$file は作成されませんでした。"
            fi
          done
          if [ -f emulator-results/activities.txt ]; then
            details=$(grep -E 'topResumedActivity|mResumedActivity' emulator-results/activities.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
            echo "::error::前面アクティビティ%0A$details"
          fi
      - name: テスト結果の保存
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: arm-emulator-graphics-result
          path: |
            emulator-results/*.txt
            emulator-results/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: テスト済み APK を保存
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: actions/upload-artifact@v4
        with:
          name: tested-modern-debug-apk
          path: app/build/outputs/apk/modern/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: テスト済み APK を試験版としてリリース
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/modern/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo '::error::公開する APK を一つに特定できません。'
            exit 1
          fi
          sha256sum --check emulator-results/tested-apk-sha256.txt
          hash=$(sha256sum "${apks[0]}" | cut -d ' ' -f 1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "${apks[0]}" | tee emulator-results/signature.txt
          {
            echo '# GameNative 試験版（modern debug）'
            echo
            echo 'Android 10 以降・arm64 向けの開発用 debug 署名 APK です。製品版ではありません。'
            echo "コミット: ${GITHUB_SHA}"
            echo "APK SHA-256: ${hash}"
            echo "試験: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '同じ APK で Android 35 x86_64 エミュレーターの ARM 変換機能を使い、ARM ライブラリ・基本描画のテスト、起動、メイン画面の前面表示、60秒間のプロセス生存を確認しました。'
            echo 'Pixel 9a 実機、ゲームの起動・描画、長時間動作、FPS、温度は未確認です。'
            echo '設定のデバッグに人工データの圧縮・部分読み込みと Android FD の試験、読み取り専用のメモリ・スワップ表示を追加。実ゲームへの透過接続や ZRAM の拡張は未対応です。'
            echo 'アプリに統合済みの実験的変更を含みます。未接続の独自 DirectX 試作、未採用の DXVK パッチ、ホスト用観測ツールは APK の機能ではありません。'
            echo '署名が既存 APK と異なる場合、上書きインストールできません。ゲームデータ保護のため、アンインストールやデータ消去はしないでください。'
          } > emulator-results/release-notes.txt
          gh release create "debug-${GITHUB_RUN_ID}" "${apks[0]}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "GameNative modern debug 試験版 (${GITHUB_RUN_ID})" \
            --notes-file emulator-results/release-notes.txt
