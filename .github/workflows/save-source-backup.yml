name: ソースバックアップを保存

on:
  push:
    paths:
      - '.github/workflows/save-source-backup.yml'

permissions:
  contents: write

jobs:
  backup:
    if: ${{ startsWith(github.event.head_commit.message, '7z バックアップを作成') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Git LFS と 7z の確認
        run: |
          set -euo pipefail
          git lfs version
          7z i >/dev/null
      - name: 履歴なしのソースを圧縮
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-backup/GameNative" backups
          # バックアップ対象を元の main のスナップショットに固定する。
          git archive 4e1d2a5c5dcbb8dca1a74a95269773d109fbce53 | tar -x -C "$RUNNER_TEMP/source-backup/GameNative"
          cp docs/作業記録.md "$RUNNER_TEMP/source-backup/作業記録.md"
          cd "$RUNNER_TEMP/source-backup"
          7z a -t7z -mx=1 "$GITHUB_WORKSPACE/backups/GameNative-source-backup.7z" GameNative 作業記録.md
          7z t "$GITHUB_WORKSPACE/backups/GameNative-source-backup.7z"
      - name: バックアップを Git LFS で保存
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs track 'backups/GameNative-source-backup.7z'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitattributes backups/GameNative-source-backup.7z
          git commit -m 'ソースの 7z バックアップを保存'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
